# Fortinet FortiOS Configuration
# Security Audit Target Sample: Admin Telnet Enabled, Insecure HTTP
config system global
    set hostname "edge-fortigate-blr-01"
    set admin-sport 8443
    set admin-ssh-port 22
    set admin-telnet enable
    set admintimeout 480
    set admin-https-redirect disable
end
config system admin
    edit "admin"
        set password-expire-warning 7
        set password-policy enable
    next
end
config log syslogd setting
    set status disable
    set server ""
end
