! Arista Networks EOS Configuration
! Security Audit Target Sample: SNMPv1 Community String and Weak VTY
!
transceiver qsfp default-mode 4x10G
!
hostname spine-arista-del-01
ip domain-name defense.internal.in
!
spanning-tree mode mstp
!
management api http-commands
   no shutdown
   protocol http
!
management security
   password encryption-reversible aes
!
line vty
   transport input telnet ssh
   exec-timeout 0 0
!
snmp-server community public ro
!
end
