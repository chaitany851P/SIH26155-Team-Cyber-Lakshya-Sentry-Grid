/* Juniper Networks Junos OS Configuration */
/* Security Audit Target Sample: Weak SSH and Missing Idle Timeout */
system {
    host-name srx-edge-junos-01;
    domain-name secure.defense.in;
    time-zone Asia/Kolkata;
    root-authentication {
        encrypted-password "$6$rounds=65536$salt$hash";
    }
    services {
        ssh {
            /* Weak SSH v1/v2 compatibility mode (FAIL DISA STIG V-215001) */
            protocol-version v1;
            max-sessions-per-connection 32;
        }
        telnet;
        web-management {
            http {
                port 80;
            }
        }
    }
    login {
        /* Missing idle-timeout (FAIL DISA STIG V-215003) */
        user admin {
            uid 2000;
            class super-user;
            authentication {
                plain-text-password-value "admin123";
            }
        }
    }
    syslog {
        archive size 100k files 3;
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
    ntp {
        server 10.10.1.50;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 192.168.1.1/24;
            }
        }
    }
}
