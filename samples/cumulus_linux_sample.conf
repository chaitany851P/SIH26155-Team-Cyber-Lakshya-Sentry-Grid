# Cumulus Linux Network Configuration (NCLU / NVUE)
# Security Audit Target Sample: Telnet Service Active, Insecure SSH Ciphers
hostname leaf-cumulus-01
net add hostname leaf-cumulus-01
net add service telnet
net add ssh cipher 3des-cbc
net add ssh cipher aes128-cbc
net add time ntp server 10.10.1.1
net add interface eth0 ip address 192.168.100.10/24
net commit
