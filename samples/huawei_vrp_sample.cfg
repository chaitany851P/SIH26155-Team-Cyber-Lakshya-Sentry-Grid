# Huawei Versatile Routing Platform (VRP) Configuration
# Security Audit Target Sample: Telnet Inbound & Weak 1024-bit RSA
sysname core-huawei-kol-01
#
undo info-center enable
#
user-interface vty 0 4
 authentication-mode password
 protocol inbound telnet
 idle-timeout 0 0
#
rsa local-key-pair create 1024
#
return
