! Cisco IOS-XE Software, Catalyst 9300 Switches
! Security Audit Target Sample: Non-Compliant Configuration
version 17.9.4a
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname core-switch-mumbai-01
!
boot-start-marker
boot-end-marker
!
vrf definition Mgmt-vrf
 address-family ipv4
 exit-address-family
!
no aaa new-model
!
ip domain name defense.internal.in
ip name-server 10.10.1.53
!
! Insecure HTTP server active (FAIL DISA STIG V-215002)
ip http server
no ip http secure-server
!
! Insecure SSH v1 active (FAIL DISA STIG V-215001)
ip ssh version 1
!
interface GigabitEthernet0/0
 vrf forwarding Mgmt-vrf
 ip address 10.10.100.1 255.255.255.0
 negotiation auto
!
interface TenGigabitEthernet1/0/1
 description Trunk to Distribution
 switchport mode trunk
!
! Missing remote logging server (FAIL CIS 2.2.1)
! Missing NTP server (FAIL CIS 2.1.1)
!
line con 0
 exec-timeout 0 0
 stopbits 1
line vty 0 4
 ! Insecure Telnet permitted (FAIL DISA STIG V-215000)
 transport input telnet ssh
 exec-timeout 0 0
 password cisco
line vty 5 15
 transport input telnet
 exec-timeout 0 0
!
end
