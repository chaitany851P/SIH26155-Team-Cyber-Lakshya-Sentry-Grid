apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentrygrid-hpa
  namespace: ntro-secops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentrygrid-compliance-auditor
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
