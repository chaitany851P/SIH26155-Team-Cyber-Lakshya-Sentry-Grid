apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentrygrid-compliance-auditor
  namespace: ntro-secops
  labels:
    app: sentrygrid
    tier: compliance-engine
    classification: defense-restricted
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentrygrid
  template:
    metadata:
      labels:
        app: sentrygrid
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: sentrygrid
        image: registry.internal.defense.gov.in/sentrygrid:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http-web
        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sentrygrid-service
  namespace: ntro-secops
spec:
  type: ClusterIP
  selector:
    app: sentrygrid
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
