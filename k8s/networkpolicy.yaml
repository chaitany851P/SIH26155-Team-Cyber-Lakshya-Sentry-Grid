apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentrygrid-airgap-policy
  namespace: ntro-secops
spec:
  podSelector:
    matchLabels:
      app: sentrygrid
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow internal web dashboard traffic from authorized jump-hosts only
  - from:
    - ipBlock:
        cidr: 10.200.0.0/16
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow SSH strictly to internal network device management subnet (port 22)
  - to:
    - ipBlock:
        cidr: 10.10.0.0/16
    ports:
    - protocol: TCP
      port: 22
  # Allow internal DNS cluster resolution
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # DENY ALL PUBLIC INTERNET EGRESS (AIR-GAPPED SOVEREIGN LOCKDOWN)
