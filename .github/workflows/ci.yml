name: Sentry-Grid CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Build Native C11 Lexer (Linux)
      if: runner.os == 'Linux'
      run: |
        gcc -O3 -shared -fPIC -std=c11 -pthread src_native/c11_lexer.c -o bin/c11_lexer.so || echo "Native build fallback"

    - name: Run 171 Automated Tests with Pytest
      run: |
        pytest tests/unit/ -v --cov=backend --cov=pkg

    - name: Test Server Health Initialization
      run: |
        python -c "from backend.server import app; print('FastAPI app initialized successfully')"
