name: Sentry-Grid CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx

    - name: Build Native C11 Shared Core (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p bin
        gcc -O3 -shared -fPIC -std=c11 -pthread -DSENTRY_EXPORTS src_native/*.c -o bin/libsentry_native.so || echo "Native build fallback"
        gcc -O3 -std=c11 -pthread -DSENTRY_CLI_APP src_native/*.c -o bin/sentry_cli || echo "CLI build fallback"
        chmod +x bin/sentry_cli || true

    - name: Run Automated Tests with Pytest
      run: |
        pytest tests/ -v --cov=backend

    - name: Test Server Health Initialization
      run: |
        python -c "from backend.server import app; print('FastAPI app initialized successfully')"
